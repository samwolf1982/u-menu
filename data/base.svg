<svg width="240" height="240" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-2xl transition-transform duration-500 group-hover:scale-105">
    <defs>
        <!-- Official-ish Ukraine Blue Gradient -->
        <linearGradient id="mainGradient" x1="100" y1="0" x2="100" y2="200" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0057B8" /> <!-- Ukraine Blue -->
            <stop offset="100%" stop-color="#1e3a8a" /> <!-- Darker Deep Blue for depth -->
        </linearGradient>

        <!-- Official-ish Ukraine Yellow Gradient -->
        <linearGradient id="accentGradient" x1="130" y1="20" x2="170" y2="90" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFD700" /> <!-- Ukraine Gold/Yellow -->
            <stop offset="100%" stop-color="#EAB308" /> <!-- Slightly darker yellow for volume -->
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Left Stem & Bottom Curve (BLUE) -->
    <path d="M30 20
                         L30 130
                         A 70 70 0 0 0 170 130
                         L170 100
                         L130 100
                         L130 130
                         A 30 30 0 0 1 70 130
                         L70 20
                         Z"
          fill="url(#mainGradient)" />

    <!-- The 3 Menu Lines (YELLOW ACCENT) -->
    <rect x="130" y="20" width="40" height="18" rx="2" fill="url(#accentGradient)" />
    <rect x="130" y="46" width="40" height="18" rx="2" fill="url(#accentGradient)" />
    <rect x="130" y="72" width="40" height="18" rx="2" fill="url(#accentGradient)" />
</svg>
