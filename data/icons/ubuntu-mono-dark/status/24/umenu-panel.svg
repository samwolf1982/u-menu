<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 200 200" fill="none" class="drop-shadow-2xl transition-transform duration-500 group-hover:scale-105">
    <defs>
        
        <linearGradient id="mainGradient" x1="100" y1="0" x2="100" y2="200" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#60A5FA" /> 
            <stop offset="100%" stop-color="#1D4ED8" /> 
        </linearGradient>

        
        <linearGradient id="accentGradient" x1="130" y1="20" x2="170" y2="90" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFD700" /> 
            <stop offset="100%" stop-color="#EAB308" /> 
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
